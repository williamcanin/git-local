# Git Local by IP address over HTTPS, for phones and other devices without name
# resolution: https://<LAN address>:8080 (port 80 on the IP is the file server).
# @ROOT@ is replaced by the data root chosen at install time.

server {
    listen 8080 ssl;

    server_name _;

    ssl_certificate     @ROOT@/git.local/cert/git.local.pem;
    ssl_certificate_key @ROOT@/git.local/cert/git.local-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host $host:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
