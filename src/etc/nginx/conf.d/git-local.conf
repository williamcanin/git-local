# Git Local on the name git.local.
# Plain HTTP redirects to HTTPS; HTTPS serves Forgejo on 127.0.0.1:3000.
# @ROOT@ is replaced by the data root chosen at install time.

server {
    listen 80;

    server_name git.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    server_name git.local;

    ssl_certificate     @ROOT@/git.local/cert/git.local.pem;
    ssl_certificate_key @ROOT@/git.local/cert/git.local-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
